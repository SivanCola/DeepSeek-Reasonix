name: GTK Measurement Audit
on:
  push:
    branches: [codex/9777-gtk-measurement-audit]
permissions:
  contents: read
concurrency:
  group: gtk-measurement-audit
  cancel-in-progress: true
jobs:
  gtk:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon gcc libgtk-3-dev libwebkit2gtk-4.0-dev xvfb
      - name: Build fixture
        working-directory: desktop
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat ../.wails-version)"
          "$(go env GOPATH)/bin/wails" generate module
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec vite build
      - name: Observe original native contract
        working-directory: desktop
        run: |
          pnpm --dir frontend exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/gtk-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.1
          done
          xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 go run -tags reasonix_transcript_smoke ./cmd/transcript-native-smoke \
            -url 'http://127.0.0.1:4173/?mock=bench&bench=1' \
            -script transcript_native_smoke_contract.js -result-file /tmp/gtk-result.json > /tmp/gtk-native.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtk-measurement-audit
          path: |
            /tmp/gtk-result.json
            /tmp/gtk-native.log
            /tmp/gtk-preview.log

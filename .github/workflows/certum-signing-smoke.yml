name: Certum signing smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certum-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'esengine/DeepSeek-Reasonix' && github.ref == 'refs/heads/main-v2'
    runs-on: windows-2022
    environment: release
    timeout-minutes: 20
    steps:
      - name: Check signing configuration
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CERTUM_USERNAME)) { throw 'Missing CERTUM_USERNAME' }
          if ($env:CERTUM_OTP_URI -notmatch '^otpauth://totp/') { throw 'CERTUM_OTP_URI must be a complete TOTP URI' }
          if ($env:CERTUM_KEY_ID -notmatch '^[0-9a-fA-F]{40}$') { throw 'CERTUM_KEY_ID must be the 40-character SHA-1 certificate thumbprint' }

      - name: Build open-source signing probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This minimal probe is covered by the repository's MIT license.
          'public static class CertumProbe { public static int Main() { System.Console.WriteLine("Reasonix Certum signing probe"); return 0; } }' |
            Set-Content probe.cs
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:probe.exe probe.cs
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed' }

      - name: Download and verify SimplySign installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.3.90/SimplySignDesktop-9.4.3.90-64-bit-en.msi' -OutFile SimplySignDesktop.msi
          $signature = Get-AuthenticodeSignature SimplySignDesktop.msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Asseco Data Systems') {
            throw 'SimplySign installer signature or publisher verification failed'
          }

      - name: Connect to SimplySign cloud certificate
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          capture-diagnostics: 'false'

      - name: Sign and verify probe
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK SignTool not found' }
          & $tool.FullName sign /sha1 $env:CERTUM_KEY_ID /fd SHA256 /tr http://timestamp.certum.pl /td SHA256 probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          & $tool.FullName verify /pa /all /tw probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'SignTool trust verification failed' }
          $signature = Get-AuthenticodeSignature probe.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:CERTUM_KEY_ID -or -not $signature.TimeStamperCertificate) {
            throw 'Signature, signer identity, or timestamp verification failed'
          }
          'Certum cloud login, signing, certificate trust, and timestamp verification passed.' >> $env:GITHUB_STEP_SUMMARY

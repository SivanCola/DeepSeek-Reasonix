name: Publish release
run-name: Publish official release

on:
  push:
    branches: [main-v2]
    paths: [release-notes/releases.json]
  workflow_call:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to recover
        required: false
        default: ""
        type: string
      recovery:
        description: Recover only missing public surfaces
        required: false
        default: false
        type: boolean

concurrency:
  group: official-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  preflight:
    name: resolve exact official candidate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      recovery: ${{ steps.release.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Resolve one reviewed official release
        id: release
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: node scripts/resolve-official-release.mjs
      - name: Wait for exact main-v2 CI and validate the candidate
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ALLOW_EXISTING_TAG: ${{ steps.release.outputs.recovery }}
        run: bash scripts/verify-official-release-candidate.sh
      - name: Render immutable reviewed notes
        if: steps.release.outputs.publish == 'true'
        run: node scripts/release-notes.mjs render --version "${{ steps.release.outputs.version }}" --output /tmp/release-notes.md
      - name: Preserve reviewed notes for every publisher
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orchestrator-reviewed-release-notes
          path: /tmp/release-notes.md
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: build private release candidate
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate and build internal candidates
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/cache-guard.sh
          node --test scripts/release-notes.test.mjs scripts/render-homebrew-cask.test.mjs npm/publish.test.mjs
          node npm/build.mjs "v$VERSION"
          tar -czf /tmp/reasonix-npm-candidate.tgz -C npm .stage
          go test ./internal/config ./internal/cli
      - uses: actions/upload-artifact@v7
        with:
          name: official-candidate-${{ needs.preflight.outputs.version }}
          path: /tmp/reasonix-npm-candidate.tgz
          if-no-files-found: error
          retention-days: 7

  authorize:
    name: approve and create official tag
    needs: [preflight, candidate]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      sha: ${{ needs.preflight.outputs.sha }}
      recovery: ${{ needs.preflight.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_TAGGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Revalidate after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          ALLOW_EXISTING_TAG: ${{ needs.preflight.outputs.recovery }}
          WAIT_FOR_CI: false
        run: bash scripts/verify-official-release-candidate.sh
      - name: Create the only public tag with the release App
        if: needs.preflight.outputs.recovery != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
      - name: Verify immutable tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          APPROVED_SHA: ${{ needs.preflight.outputs.sha }}
        run: bash scripts/verify-release-tag.sh

  cli:
    name: stage CLI, checksums, and Homebrew
    needs: authorize
    uses: ./.github/workflows/release.yml
    with:
      channel: stable
      tag: ${{ needs.authorize.outputs.tag }}
      approved_cli_tag: ${{ needs.authorize.outputs.tag }}
      approved_sha: ${{ needs.authorize.outputs.sha }}
      orchestrated: true
      orchestrator: stable
    secrets: inherit

  npm:
    name: stage npm packages
    needs: authorize
    uses: ./.github/workflows/release-npm.yml
    with:
      channel: stable
      base_version: ${{ needs.authorize.outputs.version }}
      tag: ${{ needs.authorize.outputs.tag }}
      approved_cli_tag: ${{ needs.authorize.outputs.tag }}
      approved_sha: ${{ needs.authorize.outputs.sha }}
      orchestrated: true
      orchestrator: stable
    secrets: inherit

  signpath-preflight:
    name: verify production signing path
    needs: authorize
    uses: ./.github/workflows/release-desktop.yml
    with:
      channel: stable
      tag: ${{ needs.authorize.outputs.tag }}
      approved_cli_tag: ${{ needs.authorize.outputs.tag }}
      approved_sha: ${{ needs.authorize.outputs.sha }}
      orchestrated: true
      orchestrator: stable
      signing_preflight: true
    secrets: inherit

  desktop:
    name: stage signed Desktop assets
    needs: [authorize, cli, signpath-preflight]
    uses: ./.github/workflows/release-desktop.yml
    with:
      channel: stable
      tag: ${{ needs.authorize.outputs.tag }}
      approved_cli_tag: ${{ needs.authorize.outputs.tag }}
      approved_sha: ${{ needs.authorize.outputs.sha }}
      orchestrated: true
      orchestrator: stable
      signing_preflight_verified: true
      defer_pointer: true
    secrets: inherit

  postflight:
    name: publish and verify every public surface
    needs: [authorize, cli, npm, desktop]
    if: ${{ always() && !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Require every staged publisher
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          for result in "$CLI_RESULT" "$NPM_RESULT" "$DESKTOP_RESULT"; do test "$result" = success; done
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Download staged Homebrew cask
        uses: actions/download-artifact@v8
        with:
          name: official-homebrew-cask-${{ needs.authorize.outputs.version }}
          path: /tmp/homebrew
      - name: Revalidate tag and staged artifacts
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        run: bash scripts/verify-release-tag.sh
      - name: Advance npm compatibility tags together
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/finalize-npm-official-release.mjs "${{ needs.authorize.outputs.version }}"
      - name: Advance R2 official pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          candidate=/tmp/candidate.json
          current=/tmp/current.json
          aws s3 cp "s3://${R2_BUCKET}/desktop-v${VERSION}/latest.json" "$candidate" --endpoint-url "$endpoint"
          if aws s3 cp "s3://${R2_BUCKET}/latest/latest.json" "$current" --endpoint-url "$endpoint" 2>/dev/null; then
            decision="$(bash scripts/decide-desktop-pointer-update.sh stable "$candidate" "$current")"
          else
            decision="update\t$candidate"
          fi
          IFS=$'\t' read -r action source <<< "$decision"
          if [ "$action" = update ]; then
            aws s3 cp "$source" "s3://${R2_BUCKET}/latest/latest.json" --endpoint-url "$endpoint" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300, stale-if-error=86400"
          elif [ "$action" != skip ]; then
            echo "::error::invalid R2 pointer decision: $decision"; exit 1
          fi
      - name: Publish the unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest --title "Reasonix $TAG"
      - name: Advance Homebrew after the unified Release is public
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          CASK_PATH: /tmp/homebrew/reasonix.rb
        run: bash scripts/publish-homebrew-cask.sh
      - name: Publish official CLI gateway metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/publish-cli-official-metadata.sh
      - name: Attach immutable release event
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorize.outputs.version }}
          TAG: ${{ needs.authorize.outputs.tag }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          published_at="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .published_at)"
          node scripts/release-event.mjs generate --version "$VERSION" --sha "$SHA" --published-at "$published_at" --output /tmp/release-event.json
          existing="$(mktemp -d)"
          if gh release download "$TAG" --pattern release-event.json --dir "$existing" 2>/dev/null; then
            cmp -s /tmp/release-event.json "$existing/release-event.json"
          else
            gh release upload "$TAG" /tmp/release-event.json
          fi
      - name: Deploy and verify the exact website publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref "$TAG"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow pages.yml --event workflow_dispatch --commit "$SHA" --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
      - name: Verify the public release ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          HOMEBREW_CASK_PATH: /tmp/homebrew/reasonix.rb
        run: bash scripts/verify-official-release-artifacts.sh

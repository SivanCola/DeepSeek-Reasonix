name: Stage npm packages

# Reusable npm staging publisher. It publishes immutable packages under
# official-staging; the parent postflight advances latest/canary/next together.
on:
  workflow_call:
    inputs:
      channel:
        description: "Publish channel selected by the approved release orchestrator"
        required: true
        type: string
      base_version:
        description: "Version to publish"
        required: true
        type: string
      tag:
        description: "Existing npm tag to check out for stable publication"
        required: false
        default: ""
        type: string
      approved_cli_tag:
        description: "Stable CLI tag recorded by the approved orchestrator"
        required: true
        type: string
      approved_sha:
        description: "Immutable commit recorded by the approved orchestrator"
        required: true
        type: string
      orchestrated:
        description: "True only when called by an approved release orchestrator"
        required: false
        default: false
        type: boolean
      orchestrator:
        description: "Trusted release orchestrator: stable or preview"
        required: false
        default: stable
        type: string
      preview_number:
        description: "Canonical Preview ordinal supplied by release-preview.yml"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Serialize every publisher for one npm dist-tag. In particular, canary
  # remains ordered even if another approved orchestrator is added later.
  group: release-npm-${{ inputs.channel || 'next' }}
  cancel-in-progress: false

jobs:
  orchestration-guard:
    name: verify approved orchestrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify caller and approved release ref
        env:
          ACTUAL_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ format('{0}/.github/workflows/release-{1}.yml@{2}', github.repository, inputs.orchestrator, github.ref) }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          APPROVED_CLI_TAG: ${{ inputs.approved_cli_tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_CHANNEL: ${{ inputs.orchestrator }}
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
          VERIFY_RELEASE_CHECKOUT: false
        run: |
          test "${{ inputs.orchestrated }}" = "true"
          bash scripts/verify-release-authorization.sh
          bash scripts/verify-release-tag.sh

  cache-guard:
    name: cache hit guard
    needs: orchestration-guard
    if: ${{ needs.orchestration-guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.approved_sha || inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/cache-guard.sh

  npm:
    name: publish npm packages
    needs: cache-guard
    if: ${{ always() && !cancelled() && needs.cache-guard.result == 'success' }}
    runs-on: ubuntu-latest
    # The parent orchestrator already passed the only release environment gate.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.approved_sha || inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # The official vX.Y.Z tag and base version resolve to the same npm version.
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_ORCHESTRATED: ${{ inputs.orchestrated }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_BASE_VERSION: ${{ inputs.base_version }}
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          IN_PREVIEW_NUMBER: ${{ inputs.preview_number }}
        run: bash scripts/resolve-npm-release.sh
      - name: Revalidate approved release ref
        if: ${{ inputs.orchestrated }}
        env:
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/verify-release-tag.sh
      - name: Publish or recover immutable npm packages
        env:
          VERSION_ARG: ${{ steps.ver.outputs.arg }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/build.mjs "$VERSION_ARG" --publish --stage-only

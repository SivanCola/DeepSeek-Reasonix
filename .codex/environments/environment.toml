# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "DeepSeek-Reasonix"

[setup]
script = '''
set -euo pipefail

export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
export GOTOOLCHAIN="${GOTOOLCHAIN:-local}"

: "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"
cd "$CODEX_WORKTREE_PATH"

# Load nvm for GUI-launched Codex shells.
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
if [ -s "$NVM_DIR/nvm.sh" ]; then
  . "$NVM_DIR/nvm.sh"
  nvm use 22 >/dev/null || nvm install 22 >/dev/null
fi

require_cmd() {
  command -v "$1" >/dev/null 2>&1 || {
    echo "missing required command: $1" >&2
    exit 127
  }
}

require_cmd git
require_cmd go
require_cmd gofmt
require_cmd node
require_cmd npm

node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
if [ "$node_major" -lt 22 ]; then
  echo "Node 22+ is required; current: $(node -v)" >&2
  exit 1
fi

if ! command -v pnpm >/dev/null 2>&1 || [ "$(pnpm -v | cut -d. -f1)" -lt 10 ]; then
  npm install -g pnpm@10
  hash -r 2>/dev/null || true
fi

go mod download
(cd desktop && go mod download)

(cd site && npm ci)
(cd desktop/frontend && pnpm install --frozen-lockfile)

command -v wails >/dev/null 2>&1 || go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

echo "setup ok"
echo "go=$(go version)"
echo "gofmt=$(command -v gofmt)"
echo "node=$(node -v)"
echo "npm=$(npm -v)"
echo "pnpm=$(pnpm -v)"
echo "gh=$(command -v gh || true)"
'''

[cleanup]
script = '''
set -euo pipefail

export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

if [ -z "${CODEX_WORKTREE_PATH:-}" ] || [ ! -d "$CODEX_WORKTREE_PATH" ]; then
  exit 0
fi

cd "$CODEX_WORKTREE_PATH"

rm -rf \
  bin dist \
  site/node_modules site/dist site/.astro \
  desktop/build/bin \
  desktop/frontend/node_modules \
  desktop/frontend/dist \
  desktop/frontend/wailsjs
'''

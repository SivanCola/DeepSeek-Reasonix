# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "DeepSeek-Reasonix（0810）"

[setup]
script = '''
set -euo pipefail

export PATH="/opt/homebrew/bin:/usr/local/bin:${HOME}/go/bin:${PATH}"
export GOTOOLCHAIN="${GOTOOLCHAIN:-local}"

: "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"
cd "$CODEX_WORKTREE_PATH"

# ---------------------------------------------------------------------------
# Node: nvm first, then fnm (this machine uses fnm; GUI Codex shells need it)
# ---------------------------------------------------------------------------
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
if [ -s "$NVM_DIR/nvm.sh" ]; then
  # shellcheck disable=SC1090
  . "$NVM_DIR/nvm.sh"
  nvm use 22 >/dev/null || nvm install 22 >/dev/null
elif command -v fnm >/dev/null 2>&1; then
  eval "$(fnm env --shell bash)"
  fnm use 22 >/dev/null 2>&1 || fnm install 22 >/dev/null
  eval "$(fnm env --shell bash)"
fi

require_cmd() {
  command -v "$1" >/dev/null 2>&1 || {
    echo "missing required command: $1" >&2
    exit 127
  }
}

require_cmd git
require_cmd go
require_cmd gofmt
require_cmd node
require_cmd npm

node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
if [ "$node_major" -lt 22 ]; then
  echo "Node 22+ is required; current: $(node -v)" >&2
  exit 1
fi

# pnpm 10+ (global; kept across worktrees)
if ! command -v pnpm >/dev/null 2>&1 || [ "$(pnpm -v | cut -d. -f1)" -lt 10 ]; then
  npm install -g pnpm@10
  hash -r 2>/dev/null || true
fi

# rg is not a build hard-dep; ensure for agent/search (soft)
if ! command -v rg >/dev/null 2>&1; then
  if command -v brew >/dev/null 2>&1; then
    brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
  else
    echo "warn: rg (ripgrep) not found; agent search may degrade" >&2
  fi
fi

# Go modules (root + desktop are separate modules)
go mod download
(cd desktop && go mod download)

# Frontend deps. test:bench hardcodes this worktree-local browser path, so the
# install command must use the same PLAYWRIGHT_BROWSERS_PATH.
(cd site && npm ci)
(
  cd desktop/frontend
  pnpm install --frozen-lockfile
  PLAYWRIGHT_BROWSERS_PATH=.pw-browsers \
    pnpm exec playwright install --only-shell chromium
)

# Wails CLI must match CI. Merely finding a different global version is not
# sufficient because generated bindings/build behavior may differ.
required_wails_version="v2.12.0"
installed_wails_version=""
if command -v wails >/dev/null 2>&1; then
  installed_wails_version="$(wails version 2>/dev/null | sed -n '1{s/[[:space:]].*$//;p;}')"
fi
if [ "$installed_wails_version" != "$required_wails_version" ]; then
  go install "github.com/wailsapp/wails/v2/cmd/wails@${required_wails_version}"
  hash -r 2>/dev/null || true
fi

# Verify the pinned CLI is now the one on PATH.
installed_wails_version="$(wails version 2>/dev/null | sed -n '1{s/[[:space:]].*$//;p;}')"
if [ "$installed_wails_version" != "$required_wails_version" ]; then
  echo "Wails $required_wails_version is required; current: ${installed_wails_version:-missing}" >&2
  exit 1
fi

echo "setup ok"
echo "go=$(go version)"
echo "gofmt=$(command -v gofmt)"
echo "node=$(node -v)"
echo "npm=$(npm -v)"
echo "pnpm=$(pnpm -v)"
echo "rg=$(command -v rg || true)"
echo "wails=$installed_wails_version"
echo "playwright=$(cd desktop/frontend && pnpm exec playwright --version)"
echo "worktree=$CODEX_WORKTREE_PATH"'''

[cleanup]
script = '''
set -euo pipefail

export PATH="/opt/homebrew/bin:/usr/local/bin:${HOME}/go/bin:${PATH}"

# Missing / already gone → success (idempotent)
if [ -z "${CODEX_WORKTREE_PATH:-}" ] || [ ! -d "$CODEX_WORKTREE_PATH" ]; then
  echo "cleanup skip: CODEX_WORKTREE_PATH unset or missing"
  exit 0
fi

cd "$CODEX_WORKTREE_PATH" || exit 0

# Do not use `pgrep -f "$CODEX_WORKTREE_PATH"`: the active Codex kernel command
# line contains the worktree path, so a path-wide kill can terminate the cleanup
# task itself and other live tasks before cleanup completes.
#
# Only remove worktree-local outputs. Do not uninstall global tools
# (pnpm / wails / go / node) or wipe GOMODCACHE.
rm -rf \
  site/node_modules \
  desktop/frontend/node_modules \
  desktop/frontend/.pw-browsers \
  desktop/frontend/dist \
  desktop/build/bin \
  2>/dev/null || true

# Local temp / coverage junk if present
rm -rf \
  .tmp \
  coverage \
  coverage.out \
  2>/dev/null || true

echo "cleanup ok"
echo "worktree=$CODEX_WORKTREE_PATH"'''
